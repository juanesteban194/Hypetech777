version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    # Supply-chain safety: do not adopt brand-new releases straight away.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
